name: daily
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs --date=$(date -u +%F)
      - run: |
          git config user.name "🤖"
          git config user.email "bot@example.com"
          git add articles.json data/articles/*.json || true
          git diff --staged --quiet || git commit -m "🌍🌦️⚽🍔🎬" -m "$(date -u +%F)"
          git push
