name: daily-backup
on:
  workflow_dispatch:
  # Schema avstängt: Pi:en (scripts/daily-local.sh via crontab) är huvudförfattare.
  # Detta workflow finns kvar som manuell backup.
permissions:
  contents: write
  models: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news-with-agent.mjs --date=$(date -u +%F)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "🤖"
          git config user.email "bot@example.com"
          git add articles.json data/articles/*.json || true
          git diff --staged --quiet || git commit -m "🌍🌦️⚽🍔🎬" -m "$(date -u +%F)"
          git push
